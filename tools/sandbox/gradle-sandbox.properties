# Sandbox-only Gradle profile for ~5 vCPU / ~5.8 GiB RAM.
# It is copied into an isolated GRADLE_USER_HOME by bootstrap-sandbox.sh.
# Do not use this file to replace the project-level Mac-oriented gradle.properties.
# Memory is intentionally bounded so lint/detekt/test JVMs have headroom.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.vfs.watch=false
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=320m
android.useAndroidX=true
android.nonTransitiveRClass=true
