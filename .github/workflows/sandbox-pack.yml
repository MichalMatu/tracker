name: Sandbox Pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-pack.yml"
  workflow_dispatch:
    inputs:
      include_offline_android:
        description: "Build and upload Android/Gradle offline cache pack"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sandbox-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sandbox-pack/meta
          printf '%s\n' "$GITHUB_SHA" > .sandbox-pack/meta/git-sha.txt
          {
            sha256sum gradle/wrapper/gradle-wrapper.properties
            sha256sum gradle/libs.versions.toml
            sha256sum settings.gradle.kts
            find . -name build.gradle.kts -type f -print0 | sort -z | xargs -0 sha256sum
          } > .sandbox-pack/meta/dependency-inputs.sha256
          printf '%s\n' "jdk=21" >> .sandbox-pack/meta/dependency-inputs.sha256
          sha256sum .sandbox-pack/meta/dependency-inputs.sha256 | awk '{print $1}' > .sandbox-pack/meta/dependency-key.txt

      - name: Create exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | zstd -T0 -10 -o "tracker-source-${GITHUB_SHA}.tar.zst"
          sha256sum "tracker-source-${GITHUB_SHA}.tar.zst" > "tracker-source-${GITHUB_SHA}.tar.zst.sha256"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tracker-source-${{ github.sha }}
          path: |
            tracker-source-${{ github.sha }}.tar.zst
            tracker-source-${{ github.sha }}.tar.zst.sha256
            .sandbox-pack/meta/git-sha.txt
            .sandbox-pack/meta/dependency-key.txt
            .sandbox-pack/meta/dependency-inputs.sha256
          retention-days: 30
          compression-level: 0

      - name: Decide whether offline pack is needed
        id: offline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.include_offline_android }}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[sandbox-offline]') }}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        if: steps.offline.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Ensure required Android SDK components
        if: steps.offline.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Warm project dependencies and Android build cache
        if: steps.offline.outputs.enabled == 'true'
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
            -Dkotlin.daemon.jvmargs=-Xmx1024m
        run: |
          set -euo pipefail
          ./gradlew --parallel --max-workers=3 qualityCheck :app:assembleDebug --stacktrace

      - name: Build and split offline Android/Gradle pack
        if: steps.offline.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(cat .sandbox-pack/meta/dependency-key.txt)
          ROOT=.sandbox-pack/offline
          mkdir -p "$ROOT/gradle-home" "$ROOT/android-sdk" "$ROOT/meta" .sandbox-pack/chunks
          cp .sandbox-pack/meta/* "$ROOT/meta/"

          cp -a "$HOME/.gradle/caches" "$ROOT/gradle-home/"
          cp -a "$HOME/.gradle/wrapper" "$ROOT/gradle-home/"

          mkdir -p "$ROOT/android-sdk/platforms" "$ROOT/android-sdk/build-tools"
          cp -a "$ANDROID_HOME/platforms/android-34" "$ROOT/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/34.0.0" "$ROOT/android-sdk/build-tools/"
          if [[ -d "$ANDROID_HOME/licenses" ]]; then
            cp -a "$ANDROID_HOME/licenses" "$ROOT/android-sdk/"
          fi

          PACK="tracker-android-offline-${KEY}.tar.zst"
          tar -C .sandbox-pack -cf - offline | zstd -T0 -10 -o "$PACK"
          sha256sum "$PACK" > .sandbox-pack/chunks/full-pack.sha256
          printf '%s\n' "$PACK" > .sandbox-pack/chunks/full-pack.name
          split -b 180M -d -a 2 "$PACK" .sandbox-pack/chunks/part-
          sha256sum .sandbox-pack/chunks/part-* > .sandbox-pack/chunks/parts.sha256
          ls -lh .sandbox-pack/chunks

      - name: Upload offline manifest
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-manifest
          path: |
            .sandbox-pack/chunks/full-pack.name
            .sandbox-pack/chunks/full-pack.sha256
            .sandbox-pack/chunks/parts.sha256
            .sandbox-pack/meta/dependency-key.txt
            .sandbox-pack/meta/dependency-inputs.sha256
          retention-days: 14
          compression-level: 0

      - name: Upload offline part 00
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-part-00
          path: .sandbox-pack/chunks/part-00
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload offline part 01
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-part-01
          path: .sandbox-pack/chunks/part-01
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload offline part 02
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-part-02
          path: .sandbox-pack/chunks/part-02
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload offline part 03
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-part-03
          path: .sandbox-pack/chunks/part-03
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload offline part 04
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-part-04
          path: .sandbox-pack/chunks/part-04
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload offline part 05
        if: steps.offline.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-android-offline-part-05
          path: .sandbox-pack/chunks/part-05
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
