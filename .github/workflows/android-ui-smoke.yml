name: Android UI Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-ui-smoke.yml"
      - "app/**"
      - "core/data/**"
      - "core/model/**"
      - "core/ui/**"
      - "feature/details/**"
      - "feature/radar/**"
      - "feature/settings/**"
      - "feature/watchlist/**"
      - "tools/ui-smoke/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
        -Dkotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
        -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/ui-smoke/run-android-ui-smoke.sh

      - name: Upload screenshots, UI dumps and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-smoke-${{ github.sha }}
          path: build/ui-smoke/
          if-no-files-found: warn
          retention-days: 30
